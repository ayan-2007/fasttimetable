name: Update Timetable

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetable-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push updated timetable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/timetable.json
          if git diff --cached --quiet; then
            echo "No changes detected in db/timetable.json. Nothing to commit."
          else
            git commit -m "chore: refresh timetable data [skip ci]"
            git push origin HEAD:main
            echo "Pushed updated db/timetable.json to main."
          fi