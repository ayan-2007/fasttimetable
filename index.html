<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FastSchedule - select your program, section and day to see your university timetable." />
  <meta name="theme-color" content="#2b6cb0" />
  <title>FastSchedule - Timetable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("fastschedule-theme"); } catch (e) { stored = null; }
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="header glass">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <path d="M9 16l2 2 4-4"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">FastSchedule</h1>
          <p class="brand-tagline">University Timetable</p>
        </div>
      </div>
      <div class="header-controls">
        <span id="updated-badge" class="badge badge-updated">Last updated: loading...</span>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle light / dark theme" title="Toggle theme">
          <svg id="icon-moon" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="icon-sun" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card glass">
      <div class="panel-heading">
        <div>
          <h2>Your Timetable</h2>
          <p class="panel-sub">Select your program, batch and day to see your classes.</p>
        </div>
      </div>

      <div class="filter-bar">
        <label class="field">
          <span class="field-label">Degree / Program</span>
          <select id="filter-degree" class="input">
            <option value="">All programs</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Batch</span>
          <select id="filter-section" class="input">
            <option value="">All sections</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Day</span>
          <select id="filter-day" class="input">
            <option value="">All days</option>
          </select>
        </label>
      </div>

      <div id="status" class="status-line" role="status" aria-live="polite"></div>
      <div id="results" class="schedule-area"></div>
    </section>
  </main>

  <footer class="footer">
    <p>FastSchedule - Automated University Timetable · Data refreshed on a schedule by GitHub Actions · <a href="https://github.com/ayan-2007/fseschedule" target="_blank" rel="noopener noreferrer">Source</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
