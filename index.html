<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FastSchedule — pick your program, semester, batch and day to see your university timetable." />
  <meta name="theme-color" content="#c5501f" />
  <title>FastSchedule — Timetable</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600;1,9..144,700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css?v=20260813b" />
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("fastschedule-theme"); } catch (e) { stored = null; }
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-glyph">F</span>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">FastSchedule</h1>
          <p class="brand-tagline">FSE &amp; FSM &middot; Timetable</p>
        </div>
      </div>

      <div class="header-controls">
        <span id="updated-badge" class="badge badge-updated">Last updated: loading&hellip;</span>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle light / dark theme" title="Toggle theme">
          <svg id="icon-moon" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="icon-sun" class="theme-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="panel-heading">
        <div>
          <h2>Your Timetable</h2>
          <p class="panel-sub">Pick your department, program, semester, batch and day.</p>
        </div>
        <button id="reset-filters" class="ghost-btn" type="button">Reset</button>
      </div>

      <div class="filter-bar">
        <label class="field">
          <span class="field-label">Department</span>
          <select id="filter-school" class="input">
            <option value="">All departments</option>
            <option value="Engineering">Engineering</option>
            <option value="Management">Management</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Program</span>
          <select id="filter-degree" class="input">
            <option value="">All programs</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Semester</span>
          <select id="filter-semester" class="input">
            <option value="">All semesters</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Batch</span>
          <select id="filter-section" class="input">
            <option value="">All sections</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Day</span>
          <select id="filter-day" class="input">
            <option value="">All days</option>
          </select>
        </label>
      </div>

      <div id="status" class="status-line" role="status" aria-live="polite"></div>
      <div id="results" class="schedule-area"></div>
    </section>
  </main>

  <footer class="footer">
    <p>
      FastSchedule &middot; Automated University Timetable &mdash;
      <a href="https://github.com/ayan-2007/fseschedule" target="_blank" rel="noopener noreferrer">source</a>
    </p>
    <p class="footer-small">
      Ayan Malik &middot;
      <a href="https://github.com/ayan-2007" target="_blank" rel="noopener noreferrer">github.com/ayan-2007</a> &middot;
      <a href="mailto:i250585@isb.nu.edu.pk">i250585@isb.nu.edu.pk</a>
    </p>
    <p class="footer-small">&copy; <span id="footer-year">2026</span></p>
  </footer>

  <script src="js/app.js?v=20260813b"></script>
</body>
</html>
